# Sao Viet Travel assistant — v0 first-draft declarations (intentionally brief).
# Improve routing guidance, argument conventions, missing-information handling
# and confirmation boundaries through v1/v2/v3 using run evidence.
#
# Tool names are fixed by data/eval_travel_*.json. The original IT Helpdesk
# declarations are kept in artifacts/it_reference/tools.yaml.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_travel_guide
    description: "Tìm cẩm nang du lịch."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, visa, luggage, destination, health, payment], default: "all", description: "Nhóm cẩm nang"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_tour_availability
    description: "Kiểm tra chỗ trống của tour."
    parameters:
      type: object
      properties:
        tour_id: {type: string, description: "Mã tour"}
        departure_date: {type: string, description: "Ngày khởi hành"}
        guests: {type: integer, default: 1, description: "Số khách"}
      required: [tour_id, departure_date]

  - name: check_transport_status
    description: "Kiểm tra tình trạng phương tiện."
    parameters:
      type: object
      properties:
        mode: {type: string, enum: [flight, train, bus, ferry], description: "Loại phương tiện"}
        route: {type: string, description: "Chặng"}
      required: [mode, route]

  - name: lookup_customer
    description: "Tra cứu khách hàng."
    parameters:
      type: object
      properties:
        customer_id: {type: string, description: "Mã khách hàng"}
      required: [customer_id]

  - name: travel_policy
    description: "Tìm trong chính sách của công ty du lịch."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, cancellation, refund, children, privacy, booking, external_tools], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_booking
    description: "Tạo đặt tour."
    parameters:
      type: object
      properties:
        tour_id: {type: string, description: "Mã tour"}
        departure_date: {type: string, description: "Ngày khởi hành"}
        guests: {type: integer, description: "Số khách"}
        customer_id: {type: string, description: "Mã khách hàng"}
        note: {type: string, default: "", description: "Ghi chú"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [tour_id, departure_date, guests, customer_id]

  # ---------------- Optional external search ----------------
  - name: search_travel_info
    description: >
      Search the public web for current travel information using Tavily.
      Use this tool for up-to-date information about attractions, food,
      hotels, transportation, events, or general travel information.
      Never send passwords, API keys, payment information, private
      identifiers, or sensitive personal data to this external tool.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "The travel information to search for."
        destination:
          type: string
          default: ""
          description: "City, region, or country related to the request."
        category:
          type: string
          enum: [general, attraction, food, hotel, transport, event]
          default: "general"
          description: "Category of travel information."
        max_results:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: "Maximum number of web results."
      required: [query]

  # ---------------- Team-built extension (bonus) ----------------
  - name: check_booking_status
    description: "Tra tình trạng đặt chỗ."
    parameters:
      type: object
      properties:
        booking_code: {type: string, description: "Mã booking"}
        customer_id: {type: string, description: "Mã khách hàng"}
      required: [booking_code, customer_id]
