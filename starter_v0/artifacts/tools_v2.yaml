# v2 — Tourism Helpdesk tools (VietTravel)
# Evolution from v1:
#   (a) search_travel_kb: explicit English-keyword requirement for `query` (KB is
#       English-indexed). Lists canonical English keyword phrases by category.
#   (b) travel_policy: same English-keyword requirement for `query` (policy docs
#       are English-indexed). Lists canonical phrases by policy_area.
#   (c) clarify: clarified that it must NOT be preceded by an unsolicited lookup
#       in the same turn when the user's intent is write/ticket creation.
#   (d) create_support_ticket: explicitly forbids pre-emptive read lookups in
#       the same turn as the clarify call (lookup must wait for confirmation).
# Tool names and JSON schemas are unchanged from v0/v1.
tools:
  # ---------------- Universal helpers ----------------
  - name: clarify
    description: >
      Ask the user a clarification question. Use this tool whenever a required
      argument is missing, malformed, or ambiguous. Also use it (with
      response_type=yes_no) as the mandatory confirmation step before calling
      any write action such as create_support_ticket.

      Important: when the user's primary intent is write/ticket creation
      ("tạo ticket", "create ticket", "báo lỗi", "report incident"), call
      `clarify` AS THE FIRST AND ONLY TOOL CALL in your turn. Do NOT add an
      unsolicited lookup of the booking/hotel/customer before calling
      `clarify`. Pre-emptive read lookups are an extra tool call violation.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Question to ask the user"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected answer type"}
        options: {type: array, default: [], items: {type: string}, description: "Multiple-choice options"}
      required: [question]

  - name: format_incident_report
    description: "Format already-collected findings into a report."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Findings already collected"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Report template"}
        incident_title: {type: string, default: "Tourism incident", description: "Title"}
      required: [findings, template]

  # ---------------- Tourism domain tools ----------------
  - name: search_travel_kb
    description: >
      Search the VietTravel knowledge base. The KB articles are indexed in
      English, so the `query` argument MUST be a short English keyword phrase
      (2-6 keywords), even when the user writes in Vietnamese.

      Canonical English queries (use these exact phrases when applicable):
        - visa / passport / nhập cảnh → "visa requirements foreign tourist" (category: visa)
        - refund / cancellation / hoàn tiền / hủy → "refund cancellation policy" (category: refund)
        - payment / MoMo / ZaloPay / installment → "payment methods MoMo" (category: payment)
        - booking instructions / đặt phòng / hướng dẫn đặt → "how to make a booking" (category: booking)
        - travel insurance / bảo hiểm → "travel insurance partners" (category: insurance)

      Do NOT pass the raw Vietnamese question as `query` — it will not match
      any article and the result list will be empty.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "English keyword phrase (2-6 keywords) matching the KB index. Required. Must be English."}
        category: {type: string, enum: [all, visa, refund, payment, booking, insurance], default: "all", description: "Category"}
        top_k: {type: integer, default: 3, description: "Number of results"}
      required: [query]

  - name: check_booking_status
    description: >
      Check the status of a booking. Call this tool ONLY when the user's intent
      is to read the booking status (e.g. "xem trạng thái BK-1001", "booking
      BK-1003 đang ở trạng thái nào?"). Do NOT call this as a side-effect of a
      ticket-creation request — write actions require `clarify` first, and any
      booking lookup belongs in a later turn after the user confirms the ticket.
    parameters:
      type: object
      properties:
        booking_id: {type: string, description: "Booking identifier in canonical format BK-XXXX (4-6 digits), e.g. BK-1001"}
      required: [booking_id]

  - name: lookup_customer
    description: "Look up a customer in the support directory."
    parameters:
      type: object
      properties:
        customer_id: {type: string, description: "Customer identifier in canonical format CUST-XXXX (3-4 digits, zero-padded), e.g. CUST-042"}
      required: [customer_id]

  - name: lookup_hotel
    description: >
      Look up a hotel or resort. Call this tool ONLY when the user's intent is
      to read hotel info. Do NOT call this as a side-effect of a ticket-creation
      request that merely mentions a hotel ID — the lookup belongs in a later
      turn after the user confirms the ticket.
    parameters:
      type: object
      properties:
        hotel_id: {type: string, description: "Hotel identifier in canonical format HTL-XXX (alphanumeric), e.g. HTL-NT5"}
      required: [hotel_id]

  - name: travel_policy
    description: >
      Search VietTravel internal policy. Policy documents are indexed in
      English, so the `query` argument MUST be a short English keyword phrase
      (2-6 keywords), even when the user writes in Vietnamese.

      Canonical English queries (use these exact phrases when applicable):
        - SLA / response time / ticketing priority → "ticketing SLA priority response time" (policy_area: ticketing)
        - privacy / personal data / data protection → "customer data privacy rights" (policy_area: data_privacy)
        - internal operations / service operations → "service operations workflow" (policy_area: service_operations)

      Do NOT pass the raw Vietnamese question as `query`.
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "English keyword phrase (2-6 keywords) matching the policy index. Required. Must be English."}
        policy_area: {type: string, enum: [all, ticketing, data_privacy, service_operations], default: "all", description: "Policy area"}
        top_k: {type: integer, default: 3, description: "Number of items"}
      required: [query]

  - name: create_support_ticket
    description: >
      Create a customer support ticket. WRITE ACTION — calling this tool
      without explicit user confirmation is a contract violation.

      Required protocol before calling this tool:
        1. Compose the payload internally (summary, priority, booking_id).
        2. Call `clarify(response_type="yes_no", question=<one-sentence summary
           of the exact payload>)` to obtain confirmation. This must be the
           FIRST AND ONLY tool call in your turn when the user just asked for
           the ticket. Do NOT add a `check_booking_status`, `lookup_hotel`, or
           `lookup_customer` call alongside `clarify` in the same turn — that
           counts as an unsolicited extra lookup.
        3. Wait for the user's explicit confirmation in a subsequent turn.
        4. ONLY THEN call this tool with `confirmed=true`.

      If the user has not yet provided all required fields, call `clarify` with
      response_type="text" to gather them first. User phrases like "tôi xác
      nhận", "xác nhận", "ok tạo đi" in the same turn as the ticket request do
      NOT count as confirmation. A confirmation turn that re-states the final
      payload is required.

      This tool returns `needs_confirmation` if called with `confirmed=false`,
      but that is a reactive safeguard — the agent must still proactively call
      `clarify` first.
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Issue summary"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Priority level"}
        booking_id: {type: string, default: "", description: "Related booking id if any, canonical format BK-XXXX"}
        confirmed: {type: boolean, default: false, description: "User has explicitly confirmed in a separate turn. Must be true to actually create the ticket."}
      required: [summary]
